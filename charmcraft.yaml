type: charm
name: certificate-translator
summary: Translate tls-certificates v1 requests to v4 providers (e.g. lego)
description: |
  A sidecar-less machine charm that provides the legacy tls-certificates (v1)
  interface to OpenStack reactive charms and translates requests to the modern
  tls-certificates v4 interface for providers like lego or self-signed. It
  handles multiple relations, auto-renewal propagation, and CA distribution.

platforms:
  ubuntu@24.04:amd64:

provides:
  legacy-certificates:
    interface: tls-certificates

requires:
  certificates:
    interface: tls-certificates

peers:
  cluster:
    interface: certificate-translator-peers

parts:
  charm:
    plugin: charm
    source: .
    build-packages:
      - libssl-dev
      - libffi-dev
      - pkg-config
    charm-python-packages:
      - cryptography>=41
      - charmlibs-interfaces-tls-certificates~=1.0
      - ops>=2.6
